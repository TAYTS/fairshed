syntax = "proto3";
package worker.v1;

option go_package = "github.com/tayts/fairsched/gen/worker/v1;workerv1";

service WorkerService {
  // PollTask long-polls for a task for up to 30 seconds.
  // Returns the next task when one is available.
  // Returns NOT_FOUND if the poll window elapses with no task — the worker should retry immediately; the server is healthy.
  // Returns any other error on failure — the worker should back off before retrying.
  // Workers should call this in a loop, reusing the same connection (one call per task).
  rpc PollTask(PollTaskRequest) returns (PollTaskResponse);

  // CompleteTask signals a task finished successfully.
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);

  // FailTask signals a task failed, with optional retry.
  rpc FailTask(FailTaskRequest) returns (FailTaskResponse);
}

message PollTaskRequest {
  string worker_id = 1;
}

message PollTaskResponse {
  string task_id = 1;
  string tenant_id = 2;
  string task_type = 3;
  double cost = 4;
  string payload = 5;
}

message CompleteTaskRequest {
  string task_id = 1;
  string worker_id = 2;
}
message CompleteTaskResponse {}

message FailTaskRequest {
  string task_id = 1;
  string worker_id = 2;
  string error = 3;
}
message FailTaskResponse {}
